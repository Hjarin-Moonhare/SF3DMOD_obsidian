name: Notify website

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify SF3DMOD.github.io
        env:
          GH_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
        run: |
          gh api repos/SF3DMOD/SF3DMOD.github.io/dispatches \
            -f event_type=content-updated
